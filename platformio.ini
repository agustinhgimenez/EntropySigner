; EntropySigner - ESP32 Educational Hardware Wallet Prototype
; https://docs.platformio.org/page/projectconf.html

[platformio]
description = EntropySigner - ESP32 Educational Hardware Wallet Prototype
default_envs = esp32s3-demo
test_dir = tests

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
test_framework = unity
lib_deps =
    lovyan03/LovyanGFX@1.1.16
build_flags =
    -I src
build_src_flags =
    -Wall
    -Wextra

; Board variant: the defaults above match an ESP32-S3-DevKitC-1 with 8 MB flash
; and no PSRAM, which boots on every DevKitC-1. For the recommended N16R8 module
; add to the env you use:
;   board_upload.flash_size = 16MB
;   board_build.arduino.memory_type = qio_opi
;   build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM

[env:esp32s3-demo]
build_flags =
    ${env.build_flags}
    -DES_MODE_DEMO=1
    -DCORE_DEBUG_LEVEL=3

[env:esp32s3-prod]
build_flags =
    ${env.build_flags}
    -DES_MODE_PRODUCTION=1
    -DCORE_DEBUG_LEVEL=0
